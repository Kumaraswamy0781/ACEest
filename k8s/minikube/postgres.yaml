apiVersion: v1
kind: Service
metadata:
  name: aceest-postgres
  namespace: aceest
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: aceest-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: aceest-postgres
  namespace: aceest
spec:
  serviceName: aceest-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: aceest-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aceest-postgres
    spec:
      automountServiceAccountToken: false
      containers:
        - name: postgres
          image: postgres:17
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: aceest
            - name: POSTGRES_USER
              value: aceest
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: aceest-runtime
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: [pg_isready, -h, 127.0.0.1, -U, aceest, -d, aceest]
            periodSeconds: 5
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 2Gi
