<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{% block title %}ACEest Fitness{% endblock %}</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head>
<body><header class="topbar"><a class="brand" href="{{ url_for('dashboard') }}">ACEest <span>FITNESS & PERFORMANCE</span></a>{% if g.user %}<nav><a href="{{ url_for('dashboard') }}">Clients</a><span>{{ g.user.username }} · {{ g.user.role }}</span><form method="post" action="{{ url_for('logout') }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button class="quiet">Log out</button></form></nav>{% endif %}</header>
<main>{% for message in get_flashed_messages() %}<p class="flash" role="status">{{ message }}</p>{% endfor %}{% block content %}{% endblock %}</main><footer>ACEest · Version 3.2.4</footer></body></html>
