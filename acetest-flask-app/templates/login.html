{% extends 'base.html' %}{% block title %}Sign in · ACEest{% endblock %}{% block content %}
<section class="login card"><p class="eyebrow">CLIENT MANAGEMENT</p><h1>Welcome back</h1><p class="muted">Sign in to manage clients, workouts, and memberships.</p>{% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Username<input name="username" autocomplete="username" required></label><label>Password<input type="password" name="password" autocomplete="current-password" required></label><button>Sign in</button></form></section>
{% endblock %}
